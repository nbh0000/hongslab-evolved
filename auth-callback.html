    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#2a1e5a,#09090b 48%);color:#f7f7f8;font-family:Inter,"Noto Sans KR",Arial,sans-serif}.card{width:min(440px,100%);padding:38px;border:1px solid #34343c;border-radius:20px;background:#131316;box-shadow:0 30px 100px #0009;text-align:center}.logo{width:132px;height:34px;margin-bottom:28px}.spinner{width:34px;height:34px;margin:0 auto 20px;border:3px solid #383342;border-top-color:#907cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{margin:0 0 12px;font-size:25px;letter-spacing:-.6px}p{margin:0;color:#9797a1;font-size:13px;line-height:1.7}.reset-form{display:grid;gap:12px;margin-top:25px;text-align:left}.reset-form label{display:grid;gap:7px;color:#aaaab3;font-size:11px;font-weight:600}.reset-form input{width:100%;height:48px;border:1px solid #3b3b43;border-radius:9px;background:#1b1b20;color:#fff;padding:0 13px;font:inherit}.reset-form button,.back-link{display:flex;width:100%;height:48px;align-items:center;justify-content:center;margin-top:3px;border:0;border-radius:9px;background:#765dff;color:#fff;font:inherit;font-weight:700;text-decoration:none}.reset-form button:disabled{opacity:.55}.form-status{min-height:18px;color:#ff9eaa;text-align:center}.back-link{margin-top:24px;background:#28282e}.benefit{margin-top:17px;padding:11px;border:1px solid #40365b;border-radius:10px;background:#7861ff17;color:#c9beff;font-size:12px;font-weight:700}[hidden]{display:none!important}@media(max-width:480px){.card{padding:32px 23px}}
  </style>
  <style>
    .card{position:relative;overflow:hidden;border-color:#3a3744;background:radial-gradient(circle at 100% 0,#765dff1e,transparent 34%),linear-gradient(145deg,#17171c,#111114)}.card::before{content:"";position:absolute;top:-115px;left:-115px;width:230px;height:230px;border:1px solid #ffffff0a;border-radius:50%;box-shadow:0 0 0 50px #ffffff03;pointer-events:none}.card>*{position:relative;z-index:1}.reset-form input:focus{outline:0;border-color:#927cff;box-shadow:0 0 0 3px #765dff24}.reset-form button,.back-link{transition:filter .18s ease,transform .18s ease,background .18s ease}.reset-form button:focus-visible,.back-link:focus-visible,.reset-form input:focus-visible{outline:3px solid #a58fff;outline-offset:3px}@media(hover:hover){.reset-form button:hover,.back-link:hover{filter:brightness(1.1);transform:translateY(-2px)}}@media(max-width:480px){body{padding:16px}.card{border-radius:18px}}

  <noscript class="javascript-required">일부 로그인·제작·결제 기능에는 JavaScript가 필요합니다. 정적 안내와 도움말은 계속 확인할 수 있습니다.</noscript>
<a class="skip-link" href="#mainContent">본문 바로가기</a>
  <main class="card" id="mainContent" tabindex="-1">
    <img class="logo" src="genilo-logo.svg" alt="Genilo" width="292" height="64" decoding="async">
    <div id="processing">
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <h1 id="title">계정을 확인하고 있습니다</h1>
      <p id="message" role="status" aria-live="polite">잠시만 기다려 주세요.</p>
      <p class="benefit" id="benefit" hidden>가입 혜택 800크레딧이 지급되었습니다.</p>
    </div>
    <form class="reset-form" id="resetForm" hidden novalidate>
      <label>새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <label>새 비밀번호 확인<input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <button type="submit">비밀번호 변경하기</button>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" id="backLink" href="/" hidden>홈으로 돌아가기</a>
    <a class="back-link" href="/help.html">로그인 도움말 보기</a>
  </main>
